<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Create Your Own Quiz Button -->
    <div class="create-quiz-button">
        <a href="./home-detail/home.html">Create Your Own Quiz</a>
    </div>

    <!-- Join Quiz Container -->
    <div class="join-container">
        <h1>Join Quiz</h1>
        <input type="text" id="quizId" placeholder="Enter Quiz ID" required>
        <input type="text" id="nickname" placeholder="Enter Your Nickname" required>
        <button id="joinQuizBtn">Join Quiz</button>
    </div>

    <script>
        // Handle Join Quiz button click
        document.getElementById('joinQuizBtn').addEventListener('click', function () {
            const quizId = document.getElementById('quizId').value.trim();
            const nickname = document.getElementById('nickname').value.trim();

            if (!quizId || !nickname) {
                alert("Please enter both Quiz ID and Nickname.");
                return;
            }

            // Redirect to the quiz page (replace with your logic)
            alert(`Joining Quiz: ${quizId} as ${nickname}`);
            // window.location.href = `quiz.html?quizId=${quizId}&nickname=${nickname}`;
        });
    </script>
</body>
</html>
